syntax = "proto3";
option java_multiple_files = true;
import "common.proto";
import "buf/validate/validate.proto";
package com.iqexception.fxhelper.api.user;

service UserService{
  rpc verifyPaySecret(VerifyPaySecretRequest) returns (VerifyPaySecretResponse);
  rpc getUserList(GetUserListRequest) returns (GetUserListResponse);
  rpc getUser(GetUserRequest) returns (GetUserResponse);
  rpc checkLogin(CheckLoginRequest) returns (CheckLoginResponse);
  rpc updatePaySecret(UpdatePaySecretRequest) returns (common.BaseResponse);
}
message VerifyPaySecretRequest{
  optional int64 user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).int64.gt = 0];
  optional string pay_secret = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}
message VerifyPaySecretResponse{
  common.ResponseStatus status = 1;
  VerifyPaySecretResult result = 2;
}
message VerifyPaySecretResult{
  optional bool is_valid = 1;
}

message GetUserListRequest{
  repeated int64 user_ids = 1 [(buf.validate.field).required = true, (buf.validate.field).repeated.min_items = 1];
}
message GetUserListResponse{
  common.ResponseStatus status = 1;
  GetUserListResult result = 2;
}
message GetUserListResult{
  repeated UserInfo user_infos = 1;
}
message UserInfo{
  optional int64 user_id = 1;
  optional string nickname = 2;
  optional string avatar = 3;
  optional string open_id = 4;
  optional string phone = 5;
  optional string union_id = 6;
}

message GetUserRequest{
  optional int64 user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).int64.gt = 0];
}
message GetUserResponse{
  common.ResponseStatus status = 1;
  GetUserResult result = 2;
}
message GetUserResult{
  optional int64 user_id = 1;
  optional string nickname = 2;
  optional string avatar = 3;
  optional string open_id = 4;
  optional string phone = 5;
  optional string union_id = 6;
}

message CheckLoginRequest{
  optional string token = 1 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}
message CheckLoginResponse{
  common.ResponseStatus status = 1;
  CheckLoginResult result = 2;
}
message CheckLoginResult{
  optional  int64 user_id = 1;
  optional string open_id = 2;
}

message UpdatePaySecretRequest{
  optional int64 user_id = 1 [(buf.validate.field).required = true, (buf.validate.field).int64.gt = 0];
  optional string pay_secret = 2 [(buf.validate.field).required = true, (buf.validate.field).string.min_len = 1];
}
